[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "log-analyzer"
version = "1.0.0"
description = "Parallel Log File Analyzer - UTS Komputasi Paralel dan Terdistribusi (Zheka Baila Arkan, 247006111152)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]
